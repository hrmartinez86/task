services:
  mysql:
    image: mysql:8.0
    container_name: trello_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME:-trello_clone}
      MYSQL_USER: ${DB_USER:-trello_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-trello_pass}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trello_redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"

  backend:
    build:
      context: ./backend
    container_name: trello_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      whatsapp:
        condition: service_started
    env_file:
      - ./.env.example
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_DIALECT: mysql
      REDIS_CHANNEL: board-events
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    command: sh -c "npm install && npm run migrate && npm run seed && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: trello_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost/api
      VITE_SOCKET_URL: http://localhost
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: trello_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_HOST_PORT:-80}:80"

  whatsapp:
    build:
      context: ./whatsapp
    container_name: trello_whatsapp
    restart: unless-stopped
    env_file:
      - ./.env.example
    environment:
      PORT: 4000
      WHATSAPP_MODE: ${WHATSAPP_MODE:-mock}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-mock-key}
    ports:
      - "${WHATSAPP_HOST_PORT:-4000}:4000"

volumes:
  mysql_data:
  uploads_data:
